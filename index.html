<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks & Grade Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
      background: #f0f1f5;
      color: #222;
      font-family: Georgia, "Times New Roman", serif;
    }
    .container {
      width: min(100%, 940px);
      margin: 0 auto;
      padding: 34px 32px 38px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 19px;
      box-shadow: 0 2px 5px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 38px;
      text-align: center;
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 500;
    }
    h2 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 25px;
      font-weight: 500;
    }
    .field { margin-bottom: 26px; }
    .field-label {
      display: block;
      margin-bottom: 13px;
      font-size: 20px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      min-height: 52px;
      padding: 11px 15px;
      border: 1px solid #d7d7d7;
      border-radius: 12px;
      background: #fff;
      color: #222;
      font: 18px Georgia, "Times New Roman", serif;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      border-color: #2c5c91;
      box-shadow: 0 0 0 3px rgba(44,92,145,.12);
    }
    #studentName { background: #eaf0ff; }
    .choices {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 28px;
      min-height: 35px;
      font-size: 19px;
    }
    .choices label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }
    input[type="radio"], input[type="checkbox"] {
      width: 21px;
      height: 21px;
      accent-color: #2d78b8;
      cursor: pointer;
    }
    .table-wrap { width: 100%; overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
      font-size: 18px;
    }
    th, td {
      border: 1px solid #dcdde1;
      padding: 13px 14px;
      text-align: left;
      vertical-align: middle;
    }
    th {
      background: #edf0f8;
      font-weight: 500;
    }
    td.subject { min-width: 190px; }
    td.mark-cell { width: 35%; min-width: 180px; }
    td.grade-cell { width: 18%; min-width: 85px; }
    .mark-input {
      min-height: 49px !important;
      border-radius: 12px !important;
      font-family: Arial, sans-serif !important;
      font-size: 18px !important;
    }
    .average-row td { background: #f5f6f8; }
    .actions {
      display: flex;
      justify-content: center;
      margin-top: 38px;
    }
    button {
      min-width: 145px;
      min-height: 59px;
      padding: 12px 25px;
      border: 0;
      border-radius: 11px;
      background: #285887;
      color: white;
      font: 20px Georgia, "Times New Roman", serif;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    button:hover { background: #1e456c; }
    button:active { transform: scale(.98); }
    .error {
      display: none;
      margin: 18px 0 0;
      color: #c62828;
      font: 16px Arial, sans-serif;
      text-align: center;
    }
    .student-info p {
      margin: 0 0 26px;
      font-size: 18px;
    }
    .results-table { margin-top: 30px; }
    .results-table td { padding: 11px 13px; }
    .total-marks {
      margin: 18px 0 0;
      text-align: center;
      font-size: 20px;
    }
    .success {
      margin: 24px 0 0;
      color: #397653;
      text-align: center;
      font: 18px Arial, sans-serif;
    }
    .back-actions { margin-top: 34px; }
    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      body { padding: 14px 10px; }
      .container { padding: 27px 17px 30px; border-radius: 15px; }
      h1 { margin-bottom: 30px; }
      .field-label { font-size: 18px; }
      .choices { gap: 12px 20px; font-size: 17px; }
      table { font-size: 16px; }
      th, td { padding: 10px 9px; }
      .mark-input { min-width: 125px; }
      .student-info p { font-size: 17px; margin-bottom: 21px; }
      button { min-width: 125px; min-height: 53px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section id="formSection">
      <h1>Student Marks Calculator</h1>

      <form id="marksForm" novalidate>
        <div class="field">
          <label class="field-label" for="studentName">Name</label>
          <input type="text" id="studentName" name="studentName"
                 placeholder="Enter student name" autocomplete="name" required>
        </div>

        <div class="field">
          <span class="field-label">Gender</span>
          <div class="choices">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Course</span>
          <div class="choices">
            <label><input type="checkbox" name="course" value="HNDIT"> HNDIT</label>
            <label><input type="checkbox" name="course" value="HNDA"> HNDA</label>
            <label><input type="checkbox" name="course" value="HNDE"> HNDE</label>
          </div>
        </div>

        <div class="table-wrap">
          <table aria-label="Enter subject marks">
            <thead>
              <tr>
                <th>Subject</th>
                <th>Marks (0–100)</th>
                <th>Grade</th>
              </tr>
            </thead>
            <tbody id="inputRows">
              <tr>
                <td class="subject">Machine Learning</td>
                <td class="mark-cell"><input class="mark-input" type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="Machine Learning marks" required></td>
                <td class="grade-cell" data-grade>–</td>
              </tr>
              <tr>
                <td class="subject">Computer Network</td>
                <td class="mark-cell"><input class="mark-input" type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="Computer Network marks" required></td>
                <td class="grade-cell" data-grade>–</td>
              </tr>
              <tr>
                <td class="subject">Architecture</td>
                <td class="mark-cell"><input class="mark-input" type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="Architecture marks" required></td>
                <td class="grade-cell" data-grade>–</td>
              </tr>
              <tr class="average-row">
                <td colspan="2">Average</td>
                <td id="liveAverage">–</td>
              </tr>
            </tbody>
          </table>
        </div>

        <p class="error" id="errorMessage" role="alert"></p>
        <div class="actions">
          <button type="submit">Calculate</button>
        </div>
      </form>
    </section>

    <section id="resultSection" hidden>
      <h1>Student Marks &amp; Grade Calculator</h1>
      <h2>Student Results</h2>

      <div class="student-info">
        <p><strong>Name:</strong> <span id="resultName"></span></p>
        <p><strong>Gender:</strong> <span id="resultGender"></span></p>
        <p><strong>Course:</strong> <span id="resultCourse"></span></p>
      </div>

      <div class="table-wrap">
        <table class="results-table" aria-label="Student results">
          <thead>
            <tr>
              <th>Subject</th>
              <th>Marks (0–100)</th>
              <th>Grade</th>
            </tr>
          </thead>
          <tbody id="resultRows"></tbody>
          <tfoot>
            <tr class="average-row">
              <td colspan="2">Average</td>
              <td id="resultAverage"></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <p class="total-marks">Total Marks: <strong id="resultTotal"></strong></p>
      <p class="success" id="successMessage"></p>

      <div class="actions back-actions">
        <button type="button" id="backButton">Back</button>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('marksForm');
    const formSection = document.getElementById('formSection');
    const resultSection = document.getElementById('resultSection');
    const errorMessage = document.getElementById('errorMessage');
    const markInputs = [...document.querySelectorAll('.mark-input')];
    const subjects = ['Machine Learning', 'Computer Network', 'Architecture'];

    // Grade scale: A = 75–100, B = 65–74, C = 50–64, S = 35–49, F = 0–34.
    function getGrade(mark) {
      if (mark >= 75) return 'A';
      if (mark >= 65) return 'B';
      if (mark >= 50) return 'C';
      if (mark >= 35) return 'S';
      return 'F';
    }

    markInputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        const value = input.value.trim();
        const valid = value !== '' && Number(value) >= 0 && Number(value) <= 100;
        document.querySelectorAll('[data-grade]')[index].textContent =
          valid ? getGrade(Number(value)) : '–';

        const allValid = markInputs.every(item =>
          item.value.trim() !== '' && Number(item.value) >= 0 && Number(item.value) <= 100
        );
        document.getElementById('liveAverage').textContent = allValid
          ? (markInputs.reduce((sum, item) => sum + Number(item.value), 0) / markInputs.length).toFixed(2)
          : '–';
        errorMessage.style.display = 'none';
      });
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      errorMessage.style.display = 'none';

      const name = document.getElementById('studentName').value.trim();
      const gender = document.querySelector('input[name="gender"]:checked');
      const courses = [...document.querySelectorAll('input[name="course"]:checked')].map(item => item.value);

      if (!name) return showError('Please enter the student name.');
      if (!gender) return showError('Please select the student gender.');
      if (courses.length === 0) return showError('Please select at least one course.');

      const marks = markInputs.map(input => input.value.trim());
      if (marks.some(mark => mark === '')) return showError('Please enter marks for all subjects.');
      if (marks.some(mark => !Number.isFinite(Number(mark)) || Number(mark) < 0 || Number(mark) > 100)) {
        return showError('Marks must be between 0 and 100.');
      }

      const numericMarks = marks.map(Number);
      const total = numericMarks.reduce((sum, mark) => sum + mark, 0);
      const average = total / numericMarks.length;

      document.getElementById('resultName').textContent = name;
      document.getElementById('resultGender').textContent = gender.value;
      document.getElementById('resultCourse').textContent = courses.join(', ');

      const resultRows = document.getElementById('resultRows');
      resultRows.replaceChildren();
      subjects.forEach((subject, index) => {
        const row = document.createElement('tr');
        [subject, numericMarks[index], getGrade(numericMarks[index])].forEach(value => {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.appendChild(cell);
        });
        resultRows.appendChild(row);
      });

      document.getElementById('resultAverage').textContent = average.toFixed(2);
      document.getElementById('resultTotal').textContent = `${total} / ${subjects.length * 100}`;
      document.getElementById('successMessage').textContent =
        `${name}'s results calculated successfully.`;

      formSection.hidden = true;
      resultSection.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    document.getElementById('backButton').addEventListener('click', () => {
      resultSection.hidden = true;
      formSection.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
